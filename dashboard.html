<body>
  <div class="page-loader" aria-hidden="true"><div class="loader-spinner"></div></div>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav class="navbar" id="navbar" aria-label="Main navigation"></nav>

  <main id="main-content">
    <section class="page-header">
      <div class="container">
        <h1>Dashboard</h1>
        <p id="dash-greeting">Loading…</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="dash-tabs" role="tablist">
          <button class="dash-tab is-active" role="tab" data-tab="stats">Stats</button>
          <button class="dash-tab" role="tab" data-tab="projects">Projects</button>
          <button class="dash-tab" role="tab" data-tab="messages">Messages <span class="dash-badge" id="msg-unread-badge" hidden>0</span></button>
          <button class="dash-tab" role="tab" data-tab="notes">Notes</button>
        </div>

        <!-- STATS -->
        <div class="dash-panel is-active" data-panel="stats">
          <div class="dashboard-grid">
            <article class="dashboard-card"><h3>Pageviews 30d</h3><p id="kpi-pageviews">—</p></article>
            <article class="dashboard-card"><h3>Visitors 30d</h3><p id="kpi-visitors">—</p></article>
            <article class="dashboard-card"><h3>Total events</h3><p id="kpi-events">—</p></article>
            <article class="dashboard-card"><h3>Messages unread</h3><p id="kpi-msg-unread">—</p></article>
            <article class="dashboard-card"><h3>Projects published</h3><p id="kpi-proj-pub">—</p></article>
            <article class="dashboard-card"><h3>Projects drafts</h3><p id="kpi-proj-draft">—</p></article>
          </div>
          <div class="dashboard-panel" style="margin-top: 1.5rem;">
            <h3>Recent events</h3>
            <ul id="recent-events" class="dashboard-events"><li>Loading…</li></ul>
          </div>
        </div>

        <!-- PROJECTS -->
        <div class="dash-panel" data-panel="projects">
          <div class="dash-toolbar">
            <h2>Projects</h2>
            <button class="btn btn-primary" id="btn-new-project">+ New</button>
          </div>
          <div id="projects-list" class="dash-list"><p>Loading…</p></div>
        </div>

        <!-- MESSAGES -->
        <div class="dash-panel" data-panel="messages">
          <div class="dash-toolbar">
            <h2>Contact messages</h2>
            <button class="btn btn-outline" id="btn-refresh-messages">Refresh</button>
          </div>
          <div id="messages-list" class="dash-list"><p>Loading…</p></div>
        </div>

        <!-- NOTES -->
        <div class="dash-panel" data-panel="notes">
          <div class="dash-toolbar">
            <h2>Notes</h2>
            <button class="btn btn-primary" id="btn-new-note">+ New</button>
          </div>
          <div id="notes-list" class="dash-list"><p>Loading…</p></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal generic -->
  <div class="dash-modal" id="dash-modal" hidden>
    <div class="dash-modal-backdrop" data-close></div>
    <div class="dash-modal-card" role="dialog" aria-modal="true" aria-labelledby="dash-modal-title">
      <header>
        <h3 id="dash-modal-title">Title</h3>
        <button class="dash-modal-close" aria-label="Close" data-close>&times;</button>
      </header>
      <div class="dash-modal-body" id="dash-modal-body"></div>
    </div>
  </div>

  <button class="back-to-top" id="back-to-top" aria-label="Back to top" type="button">
    <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#chevron-up"></use></svg>
  </button>

  <footer class="footer"></footer>

  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/consent.js"></script>
  <script src="assets/js/font-loader.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script src="/assets/js/pwa.js" defer></script>
  <script src="assets/js/dashboard.js" defer></script>
</body>
</html>
