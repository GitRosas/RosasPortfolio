<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JM Rosa">
  <title>Offline — João Miguel Rosa</title>
  <meta name="description" content="Offline fallback page for the João Miguel Rosa portfolio.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800;900&display=swap" media="print" data-defer-css>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="page-loader" aria-hidden="true"><div class="loader-spinner"></div></div>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <main id="main-content">
    <section class="page-header">
      <div class="container">
        <h1 data-i18n="offline.title">You are offline</h1>
        <p data-i18n="offline.message">No internet connection. Some features require you to be online. Please reconnect and try again.</p>
      </div>
    </section>
    <section class="section">
      <div class="container text-center">
        <div class="cta-actions">
          <button id="retry-btn" class="btn btn-primary" type="button" data-i18n="offline.retry">Retry</button>
          <a href="/" class="btn btn-outline" data-i18n="offline.home">Go home</a>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/font-loader.js" defer></script>
  <script src="/assets/js/offline.js" defer></script>
  <script src="/assets/js/pwa.js" defer></script>
</body>
</html>
