<body>
  <div class="page-loader" aria-hidden="true"><div class="loader-spinner"></div></div>
  <a class="skip-link" href="#main-content">Skip to main content</a>

<!-- Navbar -->
  <nav class="navbar" id="navbar" aria-label="Main navigation"></nav>

  <main id="main-content">
    <section class="page-header">
      <div class="container">
        <h1 data-i18n="pages.portfolioTitle">Portfolio</h1>
        <p data-i18n="pages.portfolioSubtitle">Exclusive gallery visible after login.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="reveal">
          <h2 class="section-title" data-i18n="pages.sliderTitle">Image Slider</h2>
          <p class="section-subtitle" data-i18n="pages.sliderSubtitle">10 photos and project visuals in a private carousel.</p>

          <div class="portfolio-slider" id="portfolio-slider" aria-roledescription="carousel" aria-label="Portfolio image slider">
            <div class="portfolio-track" id="portfolio-track">
              <figure class="portfolio-slide"><img src="assets/img/foto.jpg" alt="Portrait photo"><figcaption class="portfolio-caption">Portrait</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/foto.jpg" alt="Avatar illustration"><figcaption class="portfolio-caption">Avatar Illustration</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/projects/cdp4.svg" alt="CDP4 project visual"><figcaption class="portfolio-caption">CDP4 Integration</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/projects/docker-dev.svg" alt="Docker development visual"><figcaption class="portfolio-caption">Docker Dev Workflow</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/projects/generic.svg" alt="Generic project visual"><figcaption class="portfolio-caption">Architecture Concept</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/projects/karvel-mb.svg" alt="Karvel MB project visual"><figcaption class="portfolio-caption">Karvel MB</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/projects/portfolio.svg" alt="Portfolio project visual"><figcaption class="portfolio-caption">Portfolio System</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/projects/pus-parser.svg" alt="PUS parser project visual"><figcaption class="portfolio-caption">PUS Parser</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/projects/syson.svg" alt="SysON project visual"><figcaption class="portfolio-caption">SysON Tooling</figcaption></figure>
              <figure class="portfolio-slide"><img src="assets/img/foto.jpg" alt="Portrait photo alternative"><figcaption class="portfolio-caption">Portrait Closeup</figcaption></figure>
            </div>

            <button class="portfolio-control prev" id="portfolio-prev" type="button" aria-label="Previous slide">
              <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#chevron-left"></use></svg>
            </button>
            <button class="portfolio-control next" id="portfolio-next" type="button" aria-label="Next slide">
              <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#chevron-right"></use></svg>
            </button>

            <div class="portfolio-dots" aria-label="Slider navigation">
              <button class="portfolio-dot active" type="button" aria-label="Slide 1"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 2"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 3"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 4"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 5"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 6"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 7"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 8"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 9"></button>
              <button class="portfolio-dot" type="button" aria-label="Slide 10"></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="portfolio-lightbox" id="portfolio-lightbox" aria-hidden="true" role="dialog" aria-label="Portfolio Lightbox">
    <div class="portfolio-lightbox-backdrop"></div>
    <div class="portfolio-lightbox-content">
      <div class="portfolio-lightbox-toolbar">
        <button id="portfolio-lightbox-zoom-out" type="button" aria-label="Zoom out"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#magnifying-glass-minus"></use></svg></button>
        <button id="portfolio-lightbox-zoom-in" type="button" aria-label="Zoom in"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#magnifying-glass-plus"></use></svg></button>
        <button id="portfolio-lightbox-fullscreen" type="button" aria-label="Toggle fullscreen"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#expand"></use></svg></button>
        <button id="portfolio-lightbox-close" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#xmark"></use></svg></button>
      </div>
      <button class="portfolio-lightbox-nav prev" id="portfolio-lightbox-prev" type="button" aria-label="Previous image">
        <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#chevron-left"></use></svg>
      </button>
      <div class="portfolio-lightbox-stage">
        <img id="portfolio-lightbox-image" src="" alt="">
      </div>
      <button class="portfolio-lightbox-nav next" id="portfolio-lightbox-next" type="button" aria-label="Next image">
        <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#chevron-right"></use></svg>
      </button>
      <div class="portfolio-lightbox-caption" id="portfolio-lightbox-caption"></div>
    </div>
  </div>

  <button class="back-to-top" id="back-to-top" aria-label="Back to top" type="button">
    <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#chevron-up"></use></svg>
  </button>
